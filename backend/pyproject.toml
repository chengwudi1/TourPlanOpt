[project]
name = "tourplanopt-backend"
version = "0.1.0"
description = "TourPlanOpt backend: collaborative trip planning with Amap routing"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.141",
  "pydantic>=2.13",
  "pydantic-settings>=2.15",
  "httpx>=0.28",
  "uvicorn[standard]>=0.52",
]

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "ruff>=0.16",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
